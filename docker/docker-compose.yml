services:
  xiaozhi-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: xiaozhi-client:local
    # 每次启动都检查源码构建，避免误拉取与当前代码无关的镜像。
    pull_policy: build
    container_name: xiaozhi-client
    restart: unless-stopped
    stop_grace_period: 30s
    # 使用镜像中的 HTTP 健康检查；无需额外网络或固定子网。

    # 只需一个端口即可访问 WebUI 和 /mcp。
    ports:
      - "${XIAOZHI_BIND_ADDRESS:-0.0.0.0}:${XIAOZHI_WEB_PORT:-9999}:9999"

    volumes:
      # 保留现有家用部署目录，可通过环境变量指定其他绝对路径。
      - "${XIAOZHI_DATA_DIR:-${HOME}/xiaozhi-client}:/workspaces"
